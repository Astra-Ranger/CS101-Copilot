<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CS101_Copilot</title>
    <link rel="stylesheet" href="/styles.css?v=20260531-mindmap" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["\\(", "\\)"],
            ["$", "$"],
          ],
          displayMath: [
            ["\\[", "\\]"],
            ["$$", "$$"],
          ],
          processEscapes: true,
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
        },
        startup: {
          typeset: false,
        },
        chtml: {
          fontURL: "/vendor/mathjax/output/chtml/fonts/woff-v2",
        },
      };
    </script>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="brand-row">
          <img
            class="app-logo"
            src="/assets/cs101-copilot-logo.png"
            alt="CS101_Copilot"
          />
        </div>
        <div class="header-course-picker">
          <label class="eyebrow" for="course-select">选择课件</label>
          <select id="course-select" aria-label="选择课件"></select>
          <button
            id="app-settings-button"
            class="chat-icon-button"
            type="button"
            aria-label="设置"
            data-tooltip="设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="5" r="1.7"></circle>
              <circle cx="12" cy="12" r="1.7"></circle>
              <circle cx="12" cy="19" r="1.7"></circle>
            </svg>
          </button>
          <div id="app-settings-panel" class="app-settings-panel" hidden>
            <div class="settings-panel-header">
              <strong>设置</strong>
              <button id="app-settings-close" type="button" aria-label="关闭设置">×</button>
            </div>
            <label class="settings-field">
              <span>替代本地部署 API</span>
              <small id="local-api-override-status">使用默认</small>
              <input
                id="local-base-url-input"
                type="url"
                autocomplete="off"
                placeholder="Base URL"
              />
              <input
                id="local-chat-path-input"
                type="text"
                autocomplete="off"
                placeholder="Path，默认 /chat/completions"
              />
              <input
                id="local-model-input"
                type="text"
                autocomplete="off"
                placeholder="模型名"
              />
              <input
                id="local-api-key-input"
                type="password"
                autocomplete="off"
                placeholder="key"
              />
              <span class="settings-checkbox">
                <input id="local-enable-thinking-input" type="checkbox" />
                <span>启用 thinking</span>
              </span>
            </label>
            <details id="autocomplete-api-details" class="settings-details">
              <summary>
                <span>自动补全 API（推荐使用 10B 以下模型）</span>
                <small id="autocomplete-api-override-status">使用默认</small>
              </summary>
              <label class="settings-field">
                <span>接口配置</span>
                <input
                  id="autocomplete-base-url-input"
                  type="url"
                  autocomplete="off"
                  placeholder="Base URL"
                />
                <input
                  id="autocomplete-chat-path-input"
                  type="text"
                  autocomplete="off"
                  placeholder="Path"
                />
                <input
                  id="autocomplete-model-input"
                  type="text"
                  autocomplete="off"
                  placeholder="模型名"
                />
                <input
                  id="autocomplete-api-key-input"
                  type="password"
                  autocomplete="off"
                  placeholder="API key"
                />
                <span class="settings-checkbox">
                  <input id="autocomplete-enable-thinking-input" type="checkbox" />
                  <span>自动补全 API 启用 thinking</span>
                </span>
              </label>
            </details>
            <div class="settings-field">
              <span>回答模式</span>
              <div class="settings-mode-toggle" role="group" aria-label="回答模式">
                <button type="button" data-answer-mode="friendly">友好</button>
                <button type="button" data-answer-mode="serious">严肃</button>
              </div>
            </div>
            <div class="settings-actions">
              <span id="settings-save-state"></span>
              <button id="settings-save-button" type="button">保存</button>
            </div>
            <p class="settings-acknowledgement">感谢徐志伟老师与李晓明老师为计算机科学教育做出的贡献，赋予了本项目最核心的价值。</p>
          </div>
        </div>
      </header>
      <main class="workspace" aria-label="AI 学习笔记工作台">
        <div class="left-column" aria-label="课件与笔记">
          <section class="panel slide-panel" aria-label="课件阅读器">
            <header class="panel-header slide-header">
              <div class="slide-title-row">
                <p class="eyebrow">Slide</p>
                <h1 id="slide-title">课件</h1>
              </div>
              <span class="page-count" id="slide-count">0 页</span>
            </header>
            <div class="slide-scroll" id="slide-list" tabindex="0"></div>
          </section>

          <section class="panel notes-panel" aria-label="课程笔记">
            <header class="panel-header notes-header">
              <div class="panel-title-row">
                <p class="eyebrow">Notes</p>
                <h2 id="notebook-title">课程笔记</h2>
              </div>
              <div class="notes-header-actions">
                <div class="note-format-toolbar" role="toolbar" aria-label="Markdown 格式">
                  <button type="button" data-markdown-command="h1" data-tooltip="一级标题">H1</button>
                  <button type="button" data-markdown-command="h2" data-tooltip="二级标题">H2</button>
                  <button type="button" data-markdown-command="h3" data-tooltip="三级标题">H3</button>
                  <button type="button" data-markdown-command="bold" data-tooltip="加粗"><strong>B</strong></button>
                  <button type="button" data-markdown-command="italic" data-tooltip="斜体"><em>I</em></button>
                  <button type="button" data-markdown-command="code" data-tooltip="代码">&lt;/&gt;</button>
                  <button type="button" data-markdown-command="list" data-tooltip="列表">&bull;</button>
                  <button type="button" data-markdown-command="link" data-tooltip="链接">@</button>
                  <button type="button" id="formula-button" data-tooltip="公式">&sum;</button>
                </div>
                <div class="note-toolbar-meta">
                  <button
                    id="note-autocomplete-toggle"
                    class="chat-icon-button"
                    type="button"
                    aria-label="AI 补全"
                    aria-pressed="true"
                    data-tooltip="关闭 AI 补全"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z"></path>
                      <path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path>
                      <path d="M5 14l.6 1.4L7 16l-1.4.6L5 18l-.6-1.4L3 16l1.4-.6z"></path>
                    </svg>
                  </button>
                  <button
                    id="new-notebook-button"
                    class="chat-icon-button"
                    type="button"
                    aria-label="新建笔记本"
                    data-tooltip="新建笔记本"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="12" cy="12" r="9"></circle>
                      <path d="M12 8v8"></path>
                      <path d="M8 12h8"></path>
                    </svg>
                  </button>
                  <button
                    id="notebook-list-button"
                    class="chat-icon-button"
                    type="button"
                    aria-label="笔记本列表"
                    data-tooltip="笔记本列表"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M5 5h14v14H5z"></path>
                      <path d="M8 9h8"></path>
                      <path d="M8 12h8"></path>
                      <path d="M8 15h5"></path>
                    </svg>
                  </button>
                  <button
                    id="export-notebook-button"
                    class="chat-icon-button"
                    type="button"
                    aria-label="导出 Markdown"
                    data-tooltip="导出 Markdown"
                  >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                      <path d="M12 4v11"></path>
                      <path d="m8 11 4 4 4-4"></path>
                      <path d="M5 19h14"></path>
                    </svg>
                  </button>
                  <span class="save-state" id="save-state">未保存</span>
                </div>
              </div>
            </header>
            <div class="notebook-menu" id="notebook-menu" hidden></div>
            <div class="note-surface">
              <div
                id="note-editor"
                class="note-editor message-markdown"
                contenteditable="true"
                role="textbox"
                aria-multiline="true"
                spellcheck="false"
                data-placeholder="记录你的理解、问题和复习线索，也可以直接输入 Markdown"
              ></div>
              <div
                id="note-autocomplete-ghost"
                class="note-autocomplete-ghost"
                aria-hidden="true"
                hidden
              ></div>
            </div>
            <div
              id="formula-modal"
              class="formula-modal"
              role="dialog"
              aria-modal="true"
              aria-labelledby="formula-modal-title"
              hidden
            >
              <div class="formula-dialog">
                <div class="formula-dialog-header">
                  <strong id="formula-modal-title">插入公式</strong>
                  <button id="formula-cancel-icon" type="button" aria-label="关闭">×</button>
                </div>
                <textarea
                  id="formula-input"
                  rows="4"
                  spellcheck="false"
                  placeholder="例如：a^2+b^2=c^2"
                ></textarea>
                <div class="formula-actions">
                  <button id="formula-cancel-button" type="button">取消</button>
                  <button id="formula-confirm-button" type="button">确认渲染</button>
                </div>
              </div>
            </div>
          </section>
        </div>

        <section class="panel chat-panel" aria-label="AI 对话">
          <header class="panel-header chat-header">
            <div class="panel-title-row">
              <p class="eyebrow">Copliot</p>
              <h2>学习助手</h2>
            </div>
            <div class="chat-header-actions">
              <button
                id="new-chat-button"
                class="chat-icon-button"
                type="button"
                aria-label="新建对话"
                data-tooltip="新建对话"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="9"></circle>
                  <path d="M12 8v8"></path>
                  <path d="M8 12h8"></path>
                </svg>
              </button>
              <button
                id="chat-history-button"
                class="chat-icon-button"
                type="button"
                aria-label="历史对话"
                data-tooltip="历史对话"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                  <path d="M3 4v6h6"></path>
                  <path d="M12 7v5l3 2"></path>
                </svg>
              </button>
              <button
                id="quiz-button"
                class="chat-icon-button"
                type="button"
                aria-label="生成练习题"
                data-tooltip="生成练习题"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="4" y="3" width="16" height="18" rx="2"></rect>
                  <path d="M8 7h8"></path>
                  <path d="M8 11h8"></path>
                  <path d="M8 15h5"></path>
                </svg>
              </button>
              <button
                id="highlight-button"
                class="chat-icon-button"
                type="button"
                aria-label="划重点"
                data-tooltip="划重点"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 19h16"></path>
                  <path d="M7 15l8.5-8.5 2 2L9 17H7z"></path>
                  <path d="M13.5 8.5l2 2"></path>
                </svg>
              </button>
              <button
                id="mindmap-button"
                class="chat-icon-button"
                type="button"
                aria-label="思维导图"
                data-tooltip="思维导图"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="5" r="2"></circle>
                  <circle cx="6" cy="17" r="2"></circle>
                  <circle cx="18" cy="17" r="2"></circle>
                  <path d="M12 7v4"></path>
                  <path d="M12 11 6 15"></path>
                  <path d="m12 11 6 4"></path>
                </svg>
              </button>
            </div>
          </header>
          <div class="chat-history-menu" id="chat-history-menu" hidden></div>
          <div class="quiz-menu" id="quiz-menu" hidden></div>
          <div class="highlight-menu" id="highlight-menu" hidden></div>
          <div class="mindmap-menu" id="mindmap-menu" hidden></div>
          <div class="message-list" id="message-list" aria-live="polite"></div>
          <form class="chat-form" id="chat-form">
            <div class="note-reference-list" id="note-reference-list"></div>
            <textarea
              id="chat-input"
              rows="1"
              spellcheck="false"
              placeholder="向 AI 提问"
            ></textarea>
            <button id="chat-submit" type="submit">发送</button>
          </form>
        </section>
      </main>
    </div>

    <script src="/slides-manifest.js"></script>
    <script src="/app.js?v=20260531-mindmap"></script>
  </body>
</html>
